<p>Date: {{ tableData()?.payload?.date }}</p>
<table>
  <tr>
    <th>Time</th>
    <th>Feed</th>
    <th>Amount</th>
    <th>Pee</th>
    <th>Poo</th>
  </tr>
  <tr *ngFor="let item of tableData()?.payload?.trackerData">
    <td>{{ item.time }}</td>
    <td>{{ item.feed }}</td>
    <td>{{ item.amount }}</td>
    <td>{{ item.pee }}</td>
    <td>{{ item.poo }}</td>
    <td><button (click)="deleteItem(item._id)">Delete</button></td>
  </tr>
</table>
