<div class="table-container date-row">
  <mat-form-field appearance="outline" class="date-picker-field">
    <mat-label>Choose a date</mat-label>
    <input
      matInput
      [matDatepicker]="picker"
      [value]="selectedDate"
      (dateChange)="onDateChange($event)"
    />
    <mat-hint>dd/mm/yyyy</mat-hint>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
  <button mat-stroked-button color="primary" class="date-button" (click)="getTodaysData()">
    Today's Date
  </button>
</div>
<div *ngIf="tableData() === null" class="spinner">
  <mat-progress-spinner
    class="spinner"
    mode="indeterminate"
    diameter="50"
    color="primary"
  ></mat-progress-spinner>
  <p>Loading data...</p>
</div>
<div class="table-container" *ngIf="tableData() !== null">
  <p>
    Entries for: <span>{{ tableData()?.payload?.date }}</span>
  </p>
  <table
    mat-table
    [dataSource]="tableData()?.payload?.trackerData"
    class="mat-elevation-z8"
  >
    <!-- Time Column -->
    <ng-container matColumnDef="time">
      <th mat-header-cell *matHeaderCellDef>Time</th>
      <td mat-cell *matCellDef="let element">{{ element.time }}</td>
    </ng-container>

    <!-- Feed Column -->
    <ng-container matColumnDef="feed">
      <th mat-header-cell *matHeaderCellDef>Feed</th>
      <td mat-cell *matCellDef="let element">{{ element.feed }}</td>
    </ng-container>

    <!-- Amount Column -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let element">{{ element.amount }}</td>
    </ng-container>

    <!-- Pee Column -->
    <ng-container matColumnDef="pee">
      <th mat-header-cell *matHeaderCellDef>Pee</th>
      <td mat-cell *matCellDef="let element">
        <mat-icon
          [class.true-icon]="element.pee"
          [class.false-icon]="!element.pee"
        >
          {{ element.pee ? "check" : "close" }}
        </mat-icon>
      </td>
    </ng-container>

    <!-- Poo Column -->
    <ng-container matColumnDef="poo">
      <th mat-header-cell *matHeaderCellDef>Poo</th>
      <td mat-cell *matCellDef="let element">
        <mat-icon
          [class.true-icon]="element.poo"
          [class.false-icon]="!element.poo"
        >
          {{ element.poo ? "check" : "close" }}
        </mat-icon>
      </td>
    </ng-container>
    <!-- Comment Column -->
    <ng-container matColumnDef="comment">
      <th mat-header-cell *matHeaderCellDef>Comment</th>
      <td mat-cell *matCellDef="let element">{{ element.comment }}</td>
    </ng-container>
    <!-- Delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>Delete</th>
      <td mat-cell *matCellDef="let element">
        <button
          mat-icon-button
          color="warn"
          aria-label="Delete"
          (click)="$event.stopPropagation(); deleteItem(element._id)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      (click)="openDialog(row._id, '0ms', '0ms')"
    ></tr>
  </table>
</div>
